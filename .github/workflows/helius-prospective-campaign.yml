name: LaunchLab prospective creator campaign (PAPER READ ONLY)

# One bounded opt-in job: each observation window has <=10 public Helius RPC calls.
# Never starts automatically on commit or on schedule.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Other PR label events also instantiate this workflow (with skipped jobs).
# Cancelling by PR ref would silently kill a 4-minute capture when an
# unrelated offline-audit label is added. Serialize; never cancel a running
# prospective capture for unrelated metadata events.
concurrency:
  group: rugger-creator-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-campaign:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-creator-campaign' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Exact checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only dependencies and pytest
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Adversarial offline campaign and earlier capture regression
        run: |
          python -m pytest -q tests/test_live_helius_prospective_campaign.py tests/test_prospective_campaign_funnel.py
          python -m pytest -q tests/test_live_helius_early_signed_s1s2.py tests/test_live_helius_ws_forward_paper.py
      - name: Four sixty-second causal observation windows; no orders
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_prospective_campaign --windows 4 --seconds 60 --max-events 200
      - name: Audit campaign attrition, verify all per-window hashes, never claim filled PnL
        run: |
          python -B -m bot.p3.prospective_campaign_funnel \
            --summary paper_artifacts/prospective_${{ github.run_id }}_summary.json \
            --output paper_artifacts/prospective_${{ github.run_id }}_funnel.json
      - name: Retain only public independently hashed evidence per window
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rugger-creator-campaign-${{ github.run_id }}
          path: paper_artifacts/prospective_${{ github.run_id }}_*.json
          retention-days: 14
          if-no-files-found: warn
