name: LaunchLab prospective creator campaign (PAPER READ ONLY)

# One bounded opt-in job: each observation window has <=10 public Helius RPC calls.
# Never starts automatically on commit or on schedule.
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-HELIUS-PROSPECTIVE-CAMPAIGN to run this Helius collection; the helius-collection environment approval is also required'
        required: true
        type: string
permissions:
  contents: read

# Other PR label events also instantiate this workflow (with skipped jobs).
# Cancelling by PR ref would silently kill a 4-minute capture when an
# unrelated offline-audit label is added. Serialize; never cancel a running
# prospective capture for unrelated metadata events.
concurrency:
  group: helius-collection
  cancel-in-progress: false

jobs:
  bounded-campaign:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'laurentmaxence13-svg/rugger_bot_v1' &&
      vars.HELIUS_COLLECTION_ENABLED == 'true' &&
      inputs.confirm == 'RUN-HELIUS-PROSPECTIVE-CAMPAIGN'
    runs-on: ubuntu-latest
    environment: helius-collection
    timeout-minutes: 9
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Exact checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only dependencies and pytest
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Adversarial offline campaign and earlier capture regression
        run: |
          python -m pytest -q tests/test_live_helius_prospective_campaign.py tests/test_prospective_campaign_funnel.py
          python -m pytest -q tests/test_live_helius_early_signed_s1s2.py tests/test_live_helius_ws_forward_paper.py
      - name: Four sixty-second causal observation windows; no orders
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_prospective_campaign --windows 4 --seconds 60 --max-events 200
      - name: Audit campaign attrition, verify all per-window hashes, never claim filled PnL
        run: |
          python -B -m bot.p3.prospective_campaign_funnel \
            --summary paper_artifacts/prospective_${{ github.run_id }}_summary.json \
            --output paper_artifacts/prospective_${{ github.run_id }}_funnel.json
      - name: Refuse to publish any file that contains the Helius key
        id: helius_key_canary
        if: always()
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ]; then echo 'HELIUS_KEY_CANARY=FAIL empty_key'; exit 1; fi
          if grep -rqsF -- "${HELIUS_API_KEY}" paper_artifacts; then echo 'HELIUS_KEY_CANARY=FAIL key_found'; exit 1; fi
          if [ -n "$(find paper_artifacts -name "*${HELIUS_API_KEY}*" 2>/dev/null | head -n 1)" ]; then echo 'HELIUS_KEY_CANARY=FAIL key_in_file_name'; exit 1; fi
          echo 'HELIUS_KEY_CANARY=PASS'
      - name: Retain only public independently hashed evidence per window
        if: always() && steps.helius_key_canary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rugger-creator-campaign-${{ github.run_id }}
          path: paper_artifacts/prospective_${{ github.run_id }}_*.json
          retention-days: 14
          if-no-files-found: warn
