name: Rugger Vercel genuine Master NO-GO preview (offline only)
on:
  pull_request:
    paths:
      - 'vercel/master-status-preview/**'
      - '.github/workflows/vercel-master-status-preview-ci.yml'
permissions:
  contents: read
jobs:
  offline-readonly-bridge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed PR without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check syntax without network
        run: |
          set -euo pipefail
          node --check vercel/master-status-preview/api/master-readiness.js
          node --check vercel/master-status-preview/app.js
      - name: Test the read-only Master proxy with mocked Render
        run: |
          set -euo pipefail
          node --test vercel/master-status-preview/tests/master-readiness.test.mjs
