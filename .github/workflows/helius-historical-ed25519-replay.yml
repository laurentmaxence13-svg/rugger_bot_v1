name: Reverify archived Helius LaunchLab Ed25519 creations (READ ONLY)

# Explicit opt-in; no orders, no wallets, no paid data and no LIVE changes.
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# Never interrupt a running bounded verification for unrelated PR labels.
concurrency:
  group: rugger-finalized-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalized-signed-creation-replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-finalized-replay' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact submitted commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Adversarial signature, clock and provenance regression
        run: |
          python -m pytest -q tests/test_finalized_campaign_replay.py tests/test_prospective_campaign_funnel.py tests/test_live_helius_prospective_campaign.py
          python -m pytest -q tests/test_live_helius_early_signed_s1s2.py tests/test_live_helius_pinned_index_creators.py
      - name: Fetch exact preexisting Helius research campaign
        run: |
          mkdir -p paper_artifacts/replay_source
          gh run download 41266654485 --repo "$GITHUB_REPOSITORY" \
            --name rugger-creator-campaign-41266654485 \
            --dir paper_artifacts/replay_source
      - name: Verify finalized exact signed outer instructions on Solana mainnet
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.p3.finalized_campaign_replay \
            --summary paper_artifacts/replay_source/prospective_41266654485_summary.json \
            --output paper_artifacts/finalized_campaign_replay_${{ github.run_id }}.json
      - name: Archive signed message evidence and explicit refusal states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finalized-creation-replay-${{ github.run_id }}
          path: paper_artifacts/finalized_campaign_replay_*.json
          retention-days: 30
          if-no-files-found: warn

  official-four-table-vendor-sample:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-bitquery-samples-v2-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout exact submitted PR without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install standalone Parquet metadata reader only
        run: python -m pip install --disable-pip-version-check 'duckdb==1.4.2'
      - name: Four fixed official free public Bitquery samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper_artifacts/bitquery_public_sample
          python -B -m bot.p3.bitquery_public_parquet_preflight --network --output "paper_artifacts/bitquery_public_sample/samples.json"
          python - <<'PY'
          import json
          r=json.load(open("paper_artifacts/bitquery_public_sample/samples.json",encoding="utf-8"))
          assert r["all_four_samples_structurally_checked"]
          assert r["economic_edge_validated"] is False
          assert r["master_net_pnl_sol"] is None
          assert r["financial_order_submitted"] is False
          print("FOUR_PUBLIC_VENDOR_PARQUET_SAMPLES_SCHEMA_VALIDATED_NOT_MASTER_PROFITABILITY")
          for k,v in sorted(r["samples"].items()):
              print(k, "rows", v["rows_in_sample"], "SOL",v.get("direct_SOL_pairs_trades"),
                    "cols",v["column_count"], "slots",v["earliest_slot"],v["latest_slot"],
                    "verified_ATOMIC_source_rows",v.get("strict_source_direct_SOL_rows_normalized_NOT_Master_fills"),
                    "success_flags",v["transaction_success_field_distributions"])
          PY
      - name: Preserve readonly public metadata report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitquery-four-public-sample-report-${{ github.run_id }}
          path: paper_artifacts/bitquery_public_sample/samples.json
          if-no-files-found: warn
          retention-days: 7
