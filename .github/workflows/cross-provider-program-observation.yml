name: Independent public Solana RPC code comparison (READ ONLY)
on:
  pull_request:
    paths:
      - 'bot/live/public_program_observer.py'
      - 'validation/live_readonly/cross_provider_program_observer.py'
      - '.github/workflows/cross-provider-program-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rugger-cross-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-public-code-from-two-rpc-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use isolated Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install only declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Compare two current public program snapshots without authorization
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m validation.live_readonly.cross_provider_program_observer
