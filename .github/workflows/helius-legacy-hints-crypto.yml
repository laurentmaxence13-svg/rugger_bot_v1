name: Three legacy-only LaunchLab hints cryptographic audit (READ ONLY)
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-HELIUS-LEGACY-HINTS-CRYPTO to run this Helius collection; the helius-collection environment approval is also required'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: helius-collection
  cancel-in-progress: false

jobs:
  finalized-hints:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'laurentmaxence13-svg/rugger_bot_v1' &&
      vars.HELIUS_COLLECTION_ENABLED == 'true' &&
      inputs.confirm == 'RUN-HELIUS-LEGACY-HINTS-CRYPTO'
    runs-on: ubuntu-latest
    environment: helius-collection
    timeout-minutes: 4
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Source revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Adversarial offline false-positive and false-negative tests
        run: python -m pytest -q tests/test_live_helius_legacy_hint_crypto_audit.py
      - name: Verify exact public historical signatures with finalized Ed25519
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -B -m bot.live.helius_legacy_hint_crypto_audit
      - name: Refuse to publish any file that contains the Helius key
        id: helius_key_canary
        if: always()
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ]; then echo 'HELIUS_KEY_CANARY=FAIL empty_key'; exit 1; fi
          if grep -rqsF -- "${HELIUS_API_KEY}" paper_artifacts; then echo 'HELIUS_KEY_CANARY=FAIL key_found'; exit 1; fi
          if [ -n "$(find paper_artifacts -name "*${HELIUS_API_KEY}*" 2>/dev/null | head -n 1)" ]; then echo 'HELIUS_KEY_CANARY=FAIL key_in_file_name'; exit 1; fi
          echo 'HELIUS_KEY_CANARY=PASS'
      - name: Archive public signed proof classification; never market PnL
        if: always() && steps.helius_key_canary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-hints-${{ github.run_id }}
          path: paper_artifacts/legacy_hint_crypto_${{ github.run_id }}.json
          retention-days: 14
          if-no-files-found: warn
