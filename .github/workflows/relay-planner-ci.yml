name: relay planner tests (PR branch only, read-only)
on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/test_relay_*.py"
      - "tests/fixtures/relay/**"
      - ".github/workflows/relay-planner-ci.yml"
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - run: python -m unittest tests.test_relay_planner tests.test_relay_store tests.test_relay_executor tests.test_relay_p1 -v
