name: Prospective two-bank CPMM markout (HELIUS READ ONLY)
on:
  pull_request:
    paths:
      - 'bot/live/cpmm_prospective_markout.py'
      - 'tests/test_live_cpmm_prospective_markout.py'
      - '.github/workflows/cpmm-prospective-markout-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rugger-prospective-cpmm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prospective-no-trade:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/current-launchlab-migration-abi-20261030')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact SHA without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared live dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Confirm preregistration precedes later Helius bank, without signing
        shell: bash
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m bot.live.cpmm_prospective_markout
