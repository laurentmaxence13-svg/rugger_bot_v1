name: Genuine Master signed S1 score replay over free Solana PAPER capture (NO ORDERS)
on:
  pull_request:
    types: [labeled]
    paths:
      - 'bot/p3/signed_creation_forward_bank.py'
      - 'bot/p4/signed_master_causal_replay.py'
      - 'tests/test_signed_master_causal_replay.py'
      - '.github/workflows/genuine-signed-master-paper-replay.yml'
permissions:
  contents: read
jobs:
  retain-and-replay-signed-s1:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-genuine-master-s1-replay-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install existing free public source verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Offline reproducibility and non-financial safety tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_signed_master_causal_replay.py tests/test_signed_creation_forward_bank.py
      - name: One strictly bounded three-window public Solana acquisition (NO Helius key)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m bot.live.public_sol_forward_cohort \
            --network --windows 3 --seconds 75 \
            --output-dir "paper_artifacts/replay_source_${GITHUB_RUN_ID}"
      - name: Independently recompute original frozen genuine Master S1 before S2
        shell: bash
        run: |
          set -euo pipefail
          python -B -m bot.p4.signed_master_causal_replay \
            "paper_artifacts/replay_source_${GITHUB_RUN_ID}"
      - name: Keep bounded public source and replay artifacts for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genuine-signed-master-s1-replay-${{ github.run_id }}
          path: paper_artifacts/replay_source_*/**/*.json
          if-no-files-found: warn
          retention-days: 30
