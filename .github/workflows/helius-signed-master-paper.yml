name: Helius signed Master PAPER integration (READ ONLY)

# Opt-in: on PR #56 add label 'run-helius-integration-once'.
# Do not schedule, trade, transfer or silently consume provider credits.
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: signed-master-paper-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrated-signed-source:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-helius-integration-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUGGER_NO_DOTENV: '1'
    steps:
      - name: Checkout exact reviewed PR commit, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Test Helius end-to-end integration without network or trading
        run: |
          python -m pytest -q tests/test_helius_signed_master_paper.py
          python -m unittest discover -s tests -p test_signed_creation_forward_bank.py -v
      - name: Observe bounded public mainnet signed creations and freeze PAPER Master
        id: bound
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_signed_master_paper \
            --network --seconds 30 \
            --output-dir paper_artifacts/helius_integrated_${{ github.run_id }}
      - name: Preserve only public, redacted PAPER evidence (zero wallet actions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helius-integrated-paper-${{ github.run_id }}
          path: paper_artifacts/helius_integrated_${{ github.run_id }}/*.json
          if-no-files-found: warn
          retention-days: 30
