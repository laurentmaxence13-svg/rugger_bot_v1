name: Helius rolling signed-source PAPER stream (NO ORDERS)

# Explicit one-off network testing only. The durable 24h observer is intended
# for a powered local workstation, not a GitHub Actions 6-hour runner.
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: rolling-source-paper-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bounded-mainnet-rolling-pilot:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-helius-rolling-phase2-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact current PR commit without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify rolling capture and dual-arm PAPER contracts offline
        run: |
          python -m pytest -q tests/test_helius_rolling_signed_paper.py tests/test_p4_live_like_paper_ledger.py
          python -m pytest -q tests/test_p4_launchlab_quote_adapter.py tests/test_p4_cpmm_quote_adapter.py
          python -m pytest -q tests/test_p4_signed_cpmm_migration.py tests/test_p4_native_asof_signal_bridge.py
      - name: Observe 180 seconds actual signed events with bounded Helius credits
        id: live
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_rolling_signed_paper \
            --network --duration-seconds 180 --rpc-call-cap 90 \
            --output-dir paper_artifacts/rolling_signed_paper_${{ github.run_id }}
      - name: Archive read-only source receipts, signed proof and refusal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rolling-signed-paper-${{ github.run_id }}
          path: paper_artifacts/rolling_signed_paper_${{ github.run_id }}/**/*.json
          if-no-files-found: warn
          retention-days: 30
