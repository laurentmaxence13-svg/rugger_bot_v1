name: Pinned signed LaunchLab root diagnosis (NO LIVE)

# Historical account layout diagnosis only: current root is not creation-time S1.
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  current-root-only:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-pinned-root' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUGGER_NO_DOTENV: '1'
    steps:
      - name: Checkout exact source without persisting authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only requirements
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Test no-signing and retrospective account boundaries
        run: python -m pytest -q tests/test_live_helius_pinned_root_diagnostic.py
      - name: Inspect exact archived signed creator's CURRENT pool root
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -B -m bot.live.helius_pinned_root_diagnostic
      - name: Retain public posthoc diagnostic; no wallet or provider secret
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-root-diagnostic-${{ github.run_id }}
          path: paper_artifacts/pinned_root_diagnostic_${{ github.run_id }}.json
          retention-days: 14
          if-no-files-found: warn
