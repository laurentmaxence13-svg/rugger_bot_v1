name: Helius recent signed LaunchLab SOL trades discovery (READ ONLY)

on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-HELIUS-RECENT-SIGNED-SOL-TRADES to run this Helius collection; the helius-collection environment approval is also required'
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: helius-collection
  cancel-in-progress: false

jobs:
  bounded-signed-sol-trade-discovery:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'laurentmaxence13-svg/rugger_bot_v1' &&
      vars.HELIUS_COLLECTION_ENABLED == 'true' &&
      inputs.confirm == 'RUN-HELIUS-RECENT-SIGNED-SOL-TRADES'
    runs-on: ubuntu-latest
    environment: helius-collection
    timeout-minutes: 4
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current unmerged source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install public-source and crypto requirements
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify source trade filtering against spoofed/unsigned fixtures
        run: |
          python -m pytest -q tests/test_live_helius_recent_signed_trade_pools.py
      - name: One-shot ten-call max finalized Helius trade lookup (NO ORDERS)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_recent_signed_trade_pools \
            --network --output paper_artifacts/signed_active_sol_pools_${{ github.run_id }}.json
      - name: Refuse to publish any file that contains the Helius key
        id: helius_key_canary
        if: always()
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ]; then echo 'HELIUS_KEY_CANARY=FAIL empty_key'; exit 1; fi
          if grep -rqsF -- "${HELIUS_API_KEY}" paper_artifacts; then echo 'HELIUS_KEY_CANARY=FAIL key_found'; exit 1; fi
          if [ -n "$(find paper_artifacts -name "*${HELIUS_API_KEY}*" 2>/dev/null | head -n 1)" ]; then echo 'HELIUS_KEY_CANARY=FAIL key_in_file_name'; exit 1; fi
          echo 'HELIUS_KEY_CANARY=PASS'
      - name: Retain the signed-trade candidate denominator and refusals
        if: always() && steps.helius_key_canary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-recent-sol-launchlab-trades-${{ github.run_id }}
          path: paper_artifacts/signed_active_sol_pools_${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
