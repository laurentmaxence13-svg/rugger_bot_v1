name: Genuine SOL-quoted market frozen PAPER price cycle (NO ORDERS)

on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: source-sol-paper-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prospectively-frozen-sol-market:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-sol-paper-replay-phase5-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        sample_page: [0, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact feature PR head without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install source dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify no-network signed scoring and conditional price-cycle invariants
        run: |
          python -m pytest -q tests/test_live_helius_sol_forward_paper_probe.py
          python -m pytest -q tests/test_live_helius_active_launchlab_cohort.py tests/test_live_helius_active_launchlab_scan.py
      - name: Observe SOL-quoted active pool and prospectively freeze before future exit price
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_sol_forward_paper_probe \
            --network --sample-page ${{ matrix.sample_page }} --wait-seconds 12 \
            --output paper_artifacts/sol_cycle_${{ github.run_id }}_group_${{ matrix.sample_page }}.json
      - name: Upload unaltered source/model evidentiary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-sol-market-paper-group-${{ matrix.sample_page }}-${{ github.run_id }}
          path: paper_artifacts/sol_cycle_${{ github.run_id }}_group_${{ matrix.sample_page }}.json
          if-no-files-found: warn
          retention-days: 30
