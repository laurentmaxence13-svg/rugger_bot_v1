name: Genuine SOL-quoted market frozen PAPER price cycle (NO ORDERS)

on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-HELIUS-SOL-FORWARD-PAPER-CYCLE to run this Helius collection; the helius-collection environment approval is also required'
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: helius-collection
  cancel-in-progress: false

jobs:
  prospectively-frozen-sol-market:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'laurentmaxence13-svg/rugger_bot_v1' &&
      vars.HELIUS_COLLECTION_ENABLED == 'true' &&
      inputs.confirm == 'RUN-HELIUS-SOL-FORWARD-PAPER-CYCLE'
    strategy:
      fail-fast: false
      matrix:
        sample_page: [0, 2, 3, 4]
    runs-on: ubuntu-latest
    environment: helius-collection
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact feature PR head without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install source dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify no-network signed scoring and conditional price-cycle invariants
        run: |
          python -m pytest -q tests/test_live_helius_sol_forward_paper_probe.py
          python -m pytest -q tests/test_live_helius_active_launchlab_cohort.py tests/test_live_helius_active_launchlab_scan.py
      - name: Observe SOL-quoted active pool and prospectively freeze before future exit price
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          python -B -m bot.live.helius_sol_forward_paper_probe \
            --network --sample-page ${{ matrix.sample_page }} --wait-seconds 12 \
            --output paper_artifacts/sol_cycle_${{ github.run_id }}_group_${{ matrix.sample_page }}.json
      - name: Refuse to publish any file that contains the Helius key
        id: helius_key_canary
        if: always()
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ]; then echo 'HELIUS_KEY_CANARY=FAIL empty_key'; exit 1; fi
          if grep -rqsiF -- "${HELIUS_API_KEY}" paper_artifacts; then echo 'HELIUS_KEY_CANARY=FAIL key_found'; exit 1; fi
          if [ -n "$(find paper_artifacts -iname "*${HELIUS_API_KEY}*" 2>/dev/null | head -n 1)" ]; then echo 'HELIUS_KEY_CANARY=FAIL key_in_file_name'; exit 1; fi
          echo 'HELIUS_KEY_CANARY=PASS'
      - name: Upload unaltered source/model evidentiary report
        if: always() && steps.helius_key_canary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-sol-market-paper-group-${{ matrix.sample_page }}-${{ github.run_id }}
          path: paper_artifacts/sol_cycle_${{ github.run_id }}_group_${{ matrix.sample_page }}.json
          if-no-files-found: warn
          retention-days: 30
