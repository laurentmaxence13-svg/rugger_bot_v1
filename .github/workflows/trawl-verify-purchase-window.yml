name: Verify Raydium purchase windows via Trawl 402 quotes (NO PAYMENT)
on:
  pull_request:
    paths:
      - 'bot/p3/trawl_verify_purchase_window.py'
      - 'tests/test_trawl_verify_purchase_window.py'
      - '.github/workflows/trawl-verify-purchase-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-archived-period-and-two-presets-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUGGER_NO_DOTENV: '1'
    steps:
      - name: Checkout read only without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Check latest archive and price two historic ranges without payment
        run: |
          set -euo pipefail
          python -B -m bot.p3.trawl_verify_purchase_window
