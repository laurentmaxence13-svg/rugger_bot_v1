name: Genuine Rugger Master PAPER Render status smoke (NO ORDERS)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  verify-readonly-master-status:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-render-master-readiness-smoke-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout reviewed PR head without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: One-shot public Render health and genuine NO-GO verification only
        shell: bash
        run: |
          set -euo pipefail
          python -B -m bot.ops.render_readiness_http_smoke --network
