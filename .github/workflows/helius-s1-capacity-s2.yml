name: S1-qualified capacity to S2 conditional LaunchLab SELL (READ ONLY)
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request, schedule.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: rugger-s1-capacity-s2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-s1-capacity-before-s2:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'fix/current-launchlab-migration-abi-20261030')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUGGER_WRITE_PUBLIC_EVIDENCE: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Screen 12 public active pools at S1, then bound followup to 3 at S2
        shell: bash
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m bot.live.helius_s1_capacity_then_s2

      - name: Archive public PAPER observations for later deduplication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-s1-capacity-s2-${{ github.run_id }}
          path: paper_artifacts/paper_public_observations/*.json
          if-no-files-found: warn
          retention-days: 30
