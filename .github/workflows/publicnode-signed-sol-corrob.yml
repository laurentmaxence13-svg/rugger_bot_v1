name: Reverify first signed SOL LaunchLab creator from a second free provider (NO ORDERS)

on:
  # Manual only (legacy port 2026-11-04, D3 rule): automatic triggers removed: pull_request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  second-provider-once:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact commit with no persisted Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Existing verifier dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Offline Ed25519 and second-provider refusal regression
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_publicnode_signed_sol_creation.py
      - name: One genesis and one exact historical creation lookup from PublicNode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper_artifacts
          python -B -m bot.live.publicnode_signed_sol_creation \
            --network --output-file paper_artifacts/publicnode_native_sol_creation.json
      - name: Retain verified read-only public source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-provider-native-sol-creator-${{ github.run_id }}
          path: paper_artifacts/publicnode_native_sol_creation.json
          if-no-files-found: warn
          retention-days: 30
