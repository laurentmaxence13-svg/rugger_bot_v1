name: One free public Solana signed LaunchLab forward PAPER sample (NO ORDERS)

# Independently samples real Solana public nodes, without Helius credentials.
# This is a one-shot study, NOT a continuously powered Master engine.
on:
  pull_request:
    paths:
      - 'bot/live/public_sol_forward_paper.py'
      - 'tests/test_public_sol_forward_paper.py'
      - '.github/workflows/free-public-solana-forward-paper.yml'

permissions:
  contents: read

jobs:
  free-no-key-pilot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact reviewed commit, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install existing public read-only verifier dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Offline public RPC no-order admission tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_public_sol_forward_paper.py
      - name: 75 seconds bounded Solana public websocket plus maximum 15 RPC reads
        shell: bash
        run: |
          set -euo pipefail
          python -B -m bot.live.public_sol_forward_paper \
            --network --seconds 75 --output-dir "paper_artifacts/free_public_signed_${GITHUB_RUN_ID}"
      - name: Keep hashed public source capture for review (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-public-signed-paper-${{ github.run_id }}
          path: paper_artifacts/free_public_signed_*/**/*.json
          if-no-files-found: warn
          retention-days: 30
