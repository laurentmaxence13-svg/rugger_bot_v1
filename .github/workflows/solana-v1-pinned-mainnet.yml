name: Reproduce two pinned Solana v1 receipts with Ed25519 (READ ONLY)
on:
  pull_request:
    paths:
      - 'bot/live/solana_v1_pinned_mainnet_probe.py'
      - 'bot/live/solana_v1_readonly.py'
      - '.github/workflows/solana-v1-pinned-mainnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-public-v1-mainnet:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install exact declared read-only dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Reproduce exact historical public v1 signatures without signing
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m bot.live.solana_v1_pinned_mainnet_probe
