name: Verify two Raydium index-selected outer signed creators (NO LIVE)
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-HELIUS-PINNED-INDEX-CREATORS to run this Helius collection; the helius-collection environment approval is also required'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: helius-collection
  cancel-in-progress: false

jobs:
  exact-finalized-creation-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'laurentmaxence13-svg/rugger_bot_v1' &&
      vars.HELIUS_COLLECTION_ENABLED == 'true' &&
      inputs.confirm == 'RUN-HELIUS-PINNED-INDEX-CREATORS'
    runs-on: ubuntu-latest
    environment: helius-collection
    timeout-minutes: 4
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared read-only dependencies and tests
        run: python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Adversarial Ed25519 index-creation proof controls
        run: python -m pytest -q tests/test_live_helius_pinned_index_creators.py
      - name: Check two pinned public creation receipts and exact signed identities
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: python -B -m bot.live.helius_pinned_index_creators
      - name: Refuse to publish any file that contains the Helius key
        id: helius_key_canary
        if: always()
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ]; then echo 'HELIUS_KEY_CANARY=FAIL empty_key'; exit 1; fi
          if grep -rqsiF -- "${HELIUS_API_KEY}" paper_artifacts; then echo 'HELIUS_KEY_CANARY=FAIL key_found'; exit 1; fi
          if [ -n "$(find paper_artifacts -iname "*${HELIUS_API_KEY}*" 2>/dev/null | head -n 1)" ]; then echo 'HELIUS_KEY_CANARY=FAIL key_in_file_name'; exit 1; fi
          echo 'HELIUS_KEY_CANARY=PASS'
      - name: Archive public proof; no private keys, wallet or orders
        if: always() && steps.helius_key_canary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-index-creator-proof-${{ github.run_id }}
          path: paper_artifacts/pinned_index_signed_proof_${{ github.run_id }}.json
          retention-days: 14
          if-no-files-found: warn
