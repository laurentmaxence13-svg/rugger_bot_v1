name: Verify both Trawl purchase pages and exact program IDs (NO PAYMENT)
on:
  pull_request:
    paths:
      - 'tools/verify_trawl_checkout_links.py'
      - '.github/workflows/trawl-checkout-page-urls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-checkout-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -B tools/verify_trawl_checkout_links.py
