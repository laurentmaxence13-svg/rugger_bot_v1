name: Bounded free public Solana signed creator cohort (NO ORDERS)
on:
  pull_request:
    paths:
      - 'bot/live/public_sol_forward_cohort.py'
      - 'tests/test_public_sol_forward_cohort.py'
      - '.github/workflows/free-public-solana-cohort.yml'
permissions:
  contents: read
jobs:
  three-window-public-readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact commit without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install existing free public-readonly dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify campaign quota and independent-creator safety offline
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_public_sol_forward_cohort.py tests/test_public_sol_forward_paper.py
      - name: Three bounded 75-second public Solana windows maximum 45 RPC reads
        shell: bash
        run: |
          set -euo pipefail
          python -B -m bot.live.public_sol_forward_cohort \
            --network --windows 3 --seconds 75 \
            --output-dir "paper_artifacts/free_public_cohort_${GITHUB_RUN_ID}"
      - name: Preserve public evidence and refusals for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-public-cohort-${{ github.run_id }}
          path: paper_artifacts/free_public_cohort_*/**/*.json
          if-no-files-found: warn
          retention-days: 30
