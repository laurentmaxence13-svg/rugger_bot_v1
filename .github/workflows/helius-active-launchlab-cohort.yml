name: Helius active-survivor LaunchLab S1-S2 cohort (READ ONLY)
on:
  # Manual only (integration 2026-11-03, D3): automatic triggers removed: pull_request.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: rugger-active-survivor-S1-S2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-cohort-before-followup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-active-survivor' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUGGER_NO_DOTENV: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RUGGER_WRITE_PUBLIC_EVIDENCE: '1'
    steps:
      - name: Checkout read-only source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt
      - name: Validate active-survivor limits, fake PnL refusals and read-only contracts
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest -q tests/test_live_helius_active_launchlab_cohort.py tests/test_live_helius_active_launchlab_scan.py tests/test_live_helius_active_size_ladder.py tests/test_live_helius_active_root_activity.py
      - name: Observe frozen 3-creator candidate sample at S1 then S2 with NO orders
        shell: bash
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m bot.live.helius_active_launchlab_cohort --research-size-ladder --prefer-root-activity

      - name: Archive public PAPER observations for later deduplication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-active-survivor-cohort-${{ github.run_id }}
          path: paper_artifacts/paper_public_observations/*.json
          if-no-files-found: warn
          retention-days: 30
