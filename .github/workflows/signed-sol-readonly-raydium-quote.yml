name: Bounded free Raydium exact-lot quote probe for signed SOL mint (NO ORDERS)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  readonly-one-shot:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-signed-sol-readonly-quote-once' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RUGGER_NO_DOTENV: '1'
      RUGGER_LIVE_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR SHA with credentials removed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Existing offline dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-live.txt 'pytest>=8,<10'
      - name: Verify quote-only refusal and no-wallet contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_real_signed_sol_exactlot_quote_probe.py
      - name: At most 2 free Raydium GET quotes and NO order or transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper_artifacts
          python -B -m bot.p3.real_signed_sol_exactlot_quote_probe \
            --network --output-file paper_artifacts/signed_sol_quote_only.json
      - name: Preserve provider refusal or conditional quote without credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-sol-readonly-route-quote-${{ github.run_id }}
          path: paper_artifacts/signed_sol_quote_only.json
          if-no-files-found: warn
          retention-days: 30
